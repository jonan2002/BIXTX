name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify backend build started
        if: always()
        run: |
          curl -X POST "${{ secrets.RENDER_APK_NOTIFY_URL }}/build/android/started" \
            -H "Content-Type: application/json" \
            -d '{"status":"started","secret":"${{ secrets.RENDER_APK_NOTIFY_SECRET }}"}'

  android-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp

          curl -fsSL \
            -o android-commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools
          unzip -q android-commandlinetools.zip -d /tmp/android-cmdline-tools

          rm -rf "$TOOLS_DIR"
          mv /tmp/android-cmdline-tools/cmdline-tools "$TOOLS_DIR"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$TOOLS_DIR/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Notify backend build completed
        if: always()
        run: |
          curl -X POST "${{ secrets.RENDER_APK_NOTIFY_URL }}/build/android/notify" \
            -H "Content-Type: application/json" \
            -d '{"status":"completed","downloadUrl":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","secret":"${{ secrets.RENDER_APK_NOTIFY_SECRET }}"}'
